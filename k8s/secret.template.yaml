apiVersion: v1
kind: Secret
metadata:
  name: foodable-secrets
  namespace: foodable
type: Opaque
stringData:
  # REQUIRED: set a long random string (do not commit real value)
  JWT_SECRET: "CHANGE_ME"

  # Optional Google OAuth; leave empty to use service defaults or set your values
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  # If set, must match your public gateway URL exposed by the LoadBalancer
  GOOGLE_CALLBACK_URL: ""

  # DATABASE_URL for Prisma. Default points to in-cluster Postgres Service.
  # To use your local DB instead, replace with your URL, e.g. on Docker Desktop:
  # postgresql://postgres:Meena%23123@host.docker.internal:5435/foodable?schema=public
  # On minikube, consider: postgresql://postgres:Meena%23123@host.minikube.internal:5435/foodable?schema=public
  DATABASE_URL: "postgresql://foodable:foodable@postgres:5432/foodable?schema=public"

