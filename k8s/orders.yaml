apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: foodable
spec:
  ports:
    - name: http
      port: 4003
      targetPort: 4003
  selector:
    app: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: foodable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: foodable-orders:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          envFrom:
            - configMapRef:
                name: foodable-config
            - secretRef:
                name: foodable-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: 4003 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4003 }
            initialDelaySeconds: 15
            periodSeconds: 10
