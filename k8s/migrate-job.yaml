apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: foodable
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrator
          # Use the catalog image which contains Prisma + schema
          image: foodable-catalog:latest
          imagePullPolicy: IfNotPresent
          command: ["sh","-lc","npx prisma migrate deploy --schema=./prisma/schema.prisma"]
          envFrom:
            - configMapRef:
                name: foodable-config
            - secretRef:
                name: foodable-secrets
