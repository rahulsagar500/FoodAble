apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: foodable
data:
  nginx.conf: |
    worker_processes  1;
    events { worker_connections 1024; }
    http {
      include       mime.types;
      sendfile      on;
      keepalive_timeout 65;

      resolver kube-dns.kube-system.svc.cluster.local valid=30s;

      server {
        listen 4000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $auth_up     http://auth.foodable.svc.cluster.local:4001;
        set $catalog_up  http://catalog.foodable.svc.cluster.local:4002;
        set $orders_up   http://orders.foodable.svc.cluster.local:4003;

        location = /healthz { return 200 "ok\n"; }

        location /api/auth/ { proxy_pass $auth_up; }

        location = /api/cart/checkout { proxy_pass $orders_up; }
        location ~* ^/api/offers/[^/]+/reserve$ { proxy_pass $orders_up; }

        location /api/restaurants { proxy_pass $catalog_up; }
        location /api/offers { proxy_pass $catalog_up; }
        location /api/me/ { proxy_pass $catalog_up; }
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: foodable
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 4000
      targetPort: 4000
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: foodable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: gateway-nginx
            items:
              - key: nginx.conf
                path: nginx.conf

