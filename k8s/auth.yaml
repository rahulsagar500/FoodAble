apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: foodable
spec:
  ports:
    - name: http
      port: 4001
      targetPort: 4001
  selector:
    app: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: foodable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: foodable-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: foodable-config
            - secretRef:
                name: foodable-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 15
            periodSeconds: 10
