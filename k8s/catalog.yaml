apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: foodable
spec:
  ports:
    - name: http
      port: 4002
      targetPort: 4002
  selector:
    app: catalog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: foodable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: foodable-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: foodable-config
            - secretRef:
                name: foodable-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: 4002 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4002 }
            initialDelaySeconds: 15
            periodSeconds: 10
